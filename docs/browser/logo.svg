<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Who Stole the Loot?</title>
  <!-- Gold coins spilling out of the top -->
  <g stroke="#9a6a00" stroke-width="1.5">
    <circle cx="24" cy="12" r="6.5" fill="#f2b705"/>
    <circle cx="40" cy="11" r="6.5" fill="#f2b705"/>
    <circle cx="32" cy="8" r="6.5" fill="#ffd23f"/>
  </g>
  <path d="M30 6.5v3M34 6.5v3" stroke="#c98f00" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Mouth of the sack -->
  <path d="M17 13c5 3 25 3 30 0l-4 9H21z" fill="#b97a3d" stroke="#5c3712" stroke-width="2" stroke-linejoin="round"/>
  <!-- Body -->
  <path d="M23 23C15 28 7 37 7 47c0 9 10 14 25 14s25-5 25-14c0-10-8-19-16-24z" fill="#a0652d" stroke="#5c3712" stroke-width="2" stroke-linejoin="round"/>
  <path d="M15 34c-3 4-4 8-4 12" stroke="#c4884b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Rope tie -->
  <rect x="20" y="20" width="24" height="5" rx="2.5" fill="#6b3f17" stroke="#3f2309" stroke-width="1.2"/>
  <!-- Question mark -->
  <path d="M25.5 37.5a6.5 6.5 0 1 1 10 5.5c-2.2 1.4-3.5 2.8-3.5 5.2v1" fill="none" stroke="#3f2309" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="32" cy="55" r="3.6" fill="#3f2309"/>
  <path d="M25.5 37.5a6.5 6.5 0 1 1 10 5.5c-2.2 1.4-3.5 2.8-3.5 5.2v1" fill="none" stroke="#ffd23f" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="32" cy="55" r="2.4" fill="#ffd23f"/>
</svg>
